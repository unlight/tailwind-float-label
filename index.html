<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="./tailwind.css" />
    <title>Tailwind float label</title>
  </head>
  <body class="bg-gray-100 flex justify-center p-4">
    <div class="bg-white p-8 rounded-lg max-w-3xl flex flex-row gap-x-4">
      <form class="space-y-4 flex-1/2">
        <h1 class="text-xl font-bold mb-4 text-gray-800">
          Float Labels Example
        </h1>
        <div class="float-container">
          <label for="fullname" class="float-label px-2 text-gray-600"
            >Full Name</label
          >
          <input
            type="text"
            id="fullname"
            class="float-input w-full px-3 py-2 border"
            placeholder="Full Name placeholder"
          />
        </div>

        <div class="float-container float-always">
          <label for="sticky" class="float-label px-2 text-gray-600"
            >Sticky (sticky)</label
          >
          <input
            type="text"
            id="sticky"
            class="float-input w-full px-3 py-2 border"
            placeholder="Sticky ph"
          />
        </div>

        <div class="float-container">
          <label for="email" class="float-label px-2 text-gray-600"
            >Email Address (2: is focused)</label
          >
          <input
            type="email"
            id="email"
            class="float-input w-full px-3 py-2 border"
            placeholder="Email Address ph"
            value="va@ma.ru"
          />
        </div>

        <div class="float-container">
          <label class="float-label px-2 text-gray-600"
            >What type of event is it?</label
          >
          <select class="float-input w-full px-3 py-2 border">
            <option></option>
            <option>Corporate event</option>
            <option>Wedding</option>
            <option>Birthday</option>
            <option>Other</option>
          </select>
        </div>

        <div class="float-container">
          <label class="float-label px-2 text-gray-600"
            >Additional details</label
          >
          <textarea
            class="float-input w-full border p-2"
            rows="3"
            placeholder="Additional details"
          ></textarea>
        </div>

        <div class="float-container text-3xl">
          <label for="bigname" class="float-label px-2 text-gray-600"
            >Big Name</label
          >
          <input
            type="text"
            id="bigname"
            class="float-input w-full px-3 py-2 border"
            placeholder="Full Name placeholder"
          />
        </div>
      </form>

      <!-- Shadcn (no float classes) -->
      <form class="space-y-4 flex-1/2">
        <h1 class="text-xl font-bold mb-4 text-gray-800">shadcn</h1>

        <!-- Phone -->
        <div data-slot="field">
          <label data-slot="field-label" for="Phone" class="px-2 text-gray-600"
            >Phone</label
          >
          <input
            data-slot="input"
            type="text"
            id="Phone"
            class="w-full px-3 py-2 border"
            placeholder="Phone placeholder"
          />
        </div>

        <!-- Url (data-float-always) -->
        <div data-slot="field" data-float-always>
          <label data-slot="field-label" for="url" class="px-2 text-gray-600"
            >Url (data-float-always)</label
          >
          <input
            data-slot="input"
            type="text"
            id="url"
            class="w-full px-3 py-2 border"
            placeholder="e.g. https://example.com (placeholder)"
          />
        </div>

        <!-- Native select -->
        <div data-slot="field" data-float-always>
          <label data-slot="field-label" for="select" class="px-2 text-gray-600"
            >Food</label
          >

          <select
            id="select"
            data-slot="native-select"
            data-size="default"
            class="appearance-none border py-2 px-3"
          >
            <optgroup
              data-slot="native-select-optgroup"
              class=""
              label="Fruits"
            >
              <option
                data-slot="native-select-option"
                value=""
                selected=""
              ></option>
              <option data-slot="native-select-option" value="apple">
                Apple
              </option>
              <option data-slot="native-select-option" value="banana">
                Banana
              </option>
              <option data-slot="native-select-option" value="blueberry">
                Blueberry
              </option>
            </optgroup>
            <optgroup
              data-slot="native-select-optgroup"
              class=""
              label="Vegetables"
            >
              <option data-slot="native-select-option" value="carrot">
                Carrot
              </option>
            </optgroup>
          </select>
        </div>

        <!-- Textarea -->
        <div data-slot="field">
          <label data-slot="field-label" for="bio" class="px-2 text-gray-600"
            >Bio</label
          >
          <textarea
            data-slot="textarea"
            id="bio"
            class="w-full border p-2"
            rows="3"
            placeholder="Tell us about yourself"
          ></textarea>
        </div>
      </form>
    </div>
  </body>
</html>

<script>
  window.onload = () => {
    const focusedElement = document.querySelector('#name');

    focusedElement.focus();
  };
</script>
